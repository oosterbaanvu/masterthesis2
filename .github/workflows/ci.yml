name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install (locked)
        run: uv sync --frozen --extra dev
      - name: Lint
        run: uv run ruff check src scripts tests
      - name: Contracts generate the committed dbt tests
        run: uv run pytest -q tests/test_contracts.py
      - name: Unit + dbt integration tests (datasets are not downloaded in CI; data tests skip)
        run: uv run pytest -q
