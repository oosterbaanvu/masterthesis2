primary_detectors:
- cdc
- dboost_gaussian
- dboost_gaussian_text
detectors:
  cdc:
    name: cdc_hgb
    params:
      confidence: 0.999
      max_iter: 100
      seed: 0
      rank_score: normalized_residual
      calibration_rows: 512
  dboost_gaussian:
    name: dboost
    params:
      model: gaussian
      params:
      - 3.0
      corr_threshold: 0.5
  dboost_gaussian_text:
    name: dboost
    params:
      model: gaussian
      params:
      - 3.0
      corr_threshold: 0.5
      type_mode: text
  iqr_outlier:
    name: iqr_outlier
    params:
      k: 1.5
      fit_on: reference
decision:
  min_gain: 0.05
  n_boot: 2000
delivery_seeds:
- 1
- 2
pool_max_rows: 9000
shared_total_budget: true
