heldout:
  mechanisms:
  - ecar
  - enar_low
  - ear_age_high
  cases:
  - id: h_bill3_x10
    column: BILL_AMT3
    operation: scale
    params:
      factor: 10
    family: scale
  - id: h_pay3_x10
    column: PAY_AMT3
    operation: scale
    params:
      factor: 10
    family: scale
  - id: h_bill4_k
    column: BILL_AMT4
    operation: scale
    params:
      factor: 0.001
    family: scale
  - id: h_limit_x10
    column: LIMIT_BAL
    operation: scale
    params:
      factor: 10
    family: scale
  - id: h_pay3_swap
    column: PAY_3
    operation: category_swap
    params:
      weighing: frequency
    family: valid_category
  - id: h_pay5_shift
    column: PAY_5
    operation: period_shift
    params:
      source_column: PAY_6
    family: shift
  - id: h_bill2_subst
    column: BILL_AMT2
    operation: plausible_substitution
    family: substitution
  - id: h_pay2_transp
    column: PAY_AMT2
    operation: digit_transposition
