dataset: uci_bank_marketing
holdout_seed: 1
pilot_seeds:
- 11
- 12
- 13
schemes:
- random
- delivery
deliveries:
- reference:
  - 1
  - 2
  selection:
  - 3
  test:
  - 4
- reference:
  - 3
  - 4
  selection:
  - 5
  - 6
  test:
  - 8
  - 9
- reference:
  - 6
  - 8
  - 9
  selection:
  - 10
  test:
  - 11
  - 12
  - 13
  - 14
  - 15
- reference:
  - 9
  - 10
  selection:
  - 11
  - 12
  - 13
  - 14
  - 15
  test:
  - 16
  - 17
  - 18
  - 19
