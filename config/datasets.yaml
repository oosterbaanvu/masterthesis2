# Dataset registry: authoritative sources, pinned versions and hashes, research roles.
#
# Roles (a dataset need not serve all of them):
#   controlled_financial : financial table into which we inject controlled errors (labels by construction)
#   existing_error_benchmark : published dirty/clean pair with independently known cell errors
#   engineering_demo : scalability / configuration-driven onboarding demonstration
#
# Hash policy: hashes were pinned at first acquisition on 2026-10-19 from the URLs below.
# A mismatch makes acquisition fail; it never silently replaces a file.
# Qualification evidence and verdicts: docs/dataset_qualification.md

datasets:

  uci_credit:
    title: "Default of Credit Card Clients (Taiwan, 2005)"
    landing_page: https://archive.ics.uci.edu/dataset/350/default+of+credit+card+clients
    doi: 10.24432/C55S3H
    licence: "CC BY 4.0 (UCI dataset page)"
    citation: "Yeh, I-C. (2009). Default of Credit Card Clients [Dataset]. UCI Machine Learning Repository. https://doi.org/10.24432/C55S3H"
    version: "UCI static archive; member dated 2023-05-22"
    roles: [controlled_financial]
    cell_error_ground_truth: false
    acquisition:
      files:
        - name: default_of_credit_card_clients.zip
          url: https://archive.ics.uci.edu/static/public/350/default+of+credit+card+clients.zip
          sha256: 56c885f84457f6680f8438f02bfcdac9579323d8a94465ee5f26e32baa727602
          extract:
            - member: "default of credit card clients.xls"
              path: default_of_credit_card_clients.xls
              sha256: 30c6be3abd8dcfd3e6096c828bad8c2f011238620f5369220bd60cfc82700933
    table:
      file: default_of_credit_card_clients.xls
      format: xls
      read_options: {header: 1}
      expected_rows: 30000
      expected_columns: [ID, LIMIT_BAL, SEX, EDUCATION, MARRIAGE, AGE, PAY_0, PAY_2, PAY_3, PAY_4, PAY_5, PAY_6,
                         BILL_AMT1, BILL_AMT2, BILL_AMT3, BILL_AMT4, BILL_AMT5, BILL_AMT6,
                         PAY_AMT1, PAY_AMT2, PAY_AMT3, PAY_AMT4, PAY_AMT5, PAY_AMT6, default payment next month]
    contract: config/contracts/uci_credit.yaml

